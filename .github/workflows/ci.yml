name: CI

on:
  push:
    branches: [beeper-main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies (Yarn, frozen)
        run: yarn install --frozen-lockfile --non-interactive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Typecheck and format check
        run: yarn run check

      - name: Build (bundles + DXT)
        run: yarn run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beeper-mcp-remote-build
          if-no-files-found: error
          path: |
            BeeperDesktop.dxt
            dist/**
            dist-mcpb/**
