name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  mcp-remote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies (Yarn, frozen)
        run: yarn install --frozen-lockfile --non-interactive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Typecheck and format check
        run: yarn workspace @beeper/mcp-remote run check

      - name: Unit tests
        run: yarn workspace @beeper/mcp-remote run test:unit

      - name: Build (bundles + DXT)
        run: yarn workspace @beeper/mcp-remote run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beeper-mcp-remote-build
          if-no-files-found: error
          path: |
            packages/mcp-remote/BeeperDesktop.dxt
            packages/mcp-remote/dist/**
            packages/mcp-remote/dist-mcpb/**
